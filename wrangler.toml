# ============================================================
# CunDrop —— 基于 Cloudflare R2 的私人云盘
# 部署前请按 README.md 修改以下标记为的项
# ============================================================

name = "cundrop"
main = "src/worker.ts"
compatibility_date = "2024-06-01"

# 静态资源(前端页面)配置
# /api/* /f/* /s/* 走 Worker, 其余直接 serving public/ 下的静态文件
[assets]
directory = "./public"
run_worker_first = ["/api/*", "/f/*", "/s/*"]
not_found_handling = "single-page-application"

# R2 存储桶绑定
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cundrop-storage"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "KV"
id = "3ba7a84fabcc429abb39a7f806bc4d9e"

[vars]
BUCKET_NAME = "cundrop-storage" # 与上面的 bucket_name 保持一致
R2_ACCOUNT_ID = "74afe3f3d9f2db4bb3ff5b23da2b0623" #
# 注: 本应通过 Secret 配置, 但该账号的 Secret 同步到运行时有问题, 暂写在这里。
# R2 密钥泄露后请去 R2 → Manage R2 API Tokens 轮换。
R2_ACCESS_KEY_ID = "f61c603ccaefe51e739ae336350d46fb"
R2_SECRET_ACCESS_KEY = "db16474d9560a3ad3566ecbedaad39e4c2ec8616ab8e0e7a5f6192c5ad790d33"
SESSION_SECRET = "ec701498bafd23b9fabf64080f1b796c00db1916fe4c115d06f9609eabe82bf6"
